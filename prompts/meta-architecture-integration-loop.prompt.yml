  - name: Maps the current architecture via the code graph
    string:
      contains: 'git kb code'
  - name: Maps symbols and data flow
    string:
      contains: 'data-flow'
  - name: Maps cross-repo references
    string:
      contains: 'cross-repo-reference'
  - name: Produces ASCII architecture diagrams
    string:
      contains: 'ASCII'
  - name: Designs named integration seams
    string:
      contains: 'seam'
  - name: Designs the front-door pattern
    string:
      contains: 'front-door'
  - name: Leverages the rusty-idd baseline
    string:
      contains: 'lifeos-meta-front-door.md'
  - name: Is fail-closed
