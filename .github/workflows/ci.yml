name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Report required checks into a GitHub merge queue's temporary branch. Without
  # this trigger, queued PRs never receive check results and stall forever.
  # Enabling the queue itself is a separate branch-protection setting (owner action).
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Default-features build guard. Every other job uses --all-features, which
  # masked a default-features-only break (argon2 OsRng needs password-hash's
  # `getrandom`; a version-mismatched dep meant it only resolved under
  # --all-features). This job builds each crate with DEFAULT features so an
  # isolated `cargo build -p prompt-hub` / `cargo publish` can never silently
  # regress again. PHTASK-0028.
  default-build:
    name: Default-Features Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p prompt-hub
      - run: cargo build -p prompthub
      - run: cargo build -p prompthub-server

  # Default-features TEST-compile + clippy guard. Every test/clippy job above
  # uses --all-features, so a feature-specific test that isn't `#[cfg(feature)]`-
  # gated compiles there but breaks an isolated `cargo test -p prompt-hub`
  # (E0432/E0433/E0599) — exactly the regression PHTASK-0041 fixed and that went
  # unnoticed because no CI job exercised the test suite under DEFAULT features.
  # `--no-run` compiles the tests without running them (fast, deterministic), and
  # `clippy --all-targets` lints the test code too. PHTASK-0043.
  default-test:
    name: Default-Features Test Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p prompt-hub --no-run
      - run: cargo clippy -p prompt-hub --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, 1.91.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # macOS runners auto-select an Xcode whose clang resource dir is incomplete,
      # so the test link fails with `ld: library 'clang_rt.osx' not found` (the
      # linker's `.../clang/<ver>/lib/darwin` search path does not exist). Pin a
      # complete latest-stable Xcode so DEVELOPER_DIR points at a toolchain that
      # ships libclang_rt.osx.a. Upgrade-only: adds a setup step, does not drop the
      # macOS matrix leg or pin the Rust toolchain down.
      - name: Select latest-stable Xcode (macOS clang_rt.osx linker fix)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          # macOS stable restored target artifacts can carry stale build-script
          # linker search paths from retired Xcode images (for example
          # Xcode_26.6_Release_Candidate_2), which makes fresh runners fail to
          # find libclang_rt.osx even after setup-xcode selects latest-stable.
          # Keep registry caching but rebuild target artifacts on macOS; Linux
          # and Windows keep target caching for speed.
          cache-targets: ${{ runner.os != 'macOS' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      # Fail the build on any rustdoc warning (broken intra-doc links,
      # missing-docs, etc.) so the warning-clean doc build cannot regress.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --all-features --no-deps

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin
      # --timeout guards tarpaulin's ptrace engine against "Timed out waiting for
      # test response": under instrumentation a large async suite can exceed the
      # 60s default per-test ceiling even though every test passes in milliseconds
      # uninstrumented. 300s is generous headroom; it does not slow healthy runs.
      - run: cargo tarpaulin --workspace --all-features --timeout 300 --out xml
      - uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t prompthub:test .
      - run: docker run --rm prompthub:test --help
      - run: docker build -f docker/Dockerfile --target builder -t prompthub:builder .

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install git-cliff
      - run: git-cliff --output CHANGELOG.md

  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p prompt-hub --dry-run

  safety:
    name: Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x scripts/check_safety.sh
      - run: ./scripts/check_safety.sh
