name: Mutation Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mutants:
    name: Cargo Mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants
      - run: cargo mutants --workspace --all-features
