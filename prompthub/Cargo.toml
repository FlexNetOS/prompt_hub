[package]
name = "prompthub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI tool for managing LLM prompts"

[[bin]]
name = "prompthub"
path = "src/main.rs"

[features]
default = ["prompt-hub/handlebars"]
smart = ["prompt-hub/smart"]
tui = ["dep:ratatui", "dep:dialoguer", "dep:console", "dep:comfy-table", "dep:syntect"]
otel = ["prompt-hub/otel"]
sqlcipher = ["prompt-hub/sqlcipher"]
tls = ["prompt-hub/tls"]
handlebars = ["prompt-hub/handlebars"]
tera = ["prompt-hub/tera"]
tiktoken = ["prompt-hub/tiktoken"]
tokenizers = ["prompt-hub/tokenizers"]
plugins = ["prompt-hub/plugins"]
qdrant = ["prompt-hub/qdrant"]
vibe = ["prompt-hub/vibe"]
preview = ["prompt-hub/preview"]
privacy = ["prompt-hub/privacy"]
quality = ["prompt-hub/quality"]
multimodal = ["prompt-hub/multimodal"]
rollback = ["prompt-hub/rollback"]
cost = ["prompt-hub/cost"]
confidence = ["prompt-hub/confidence"]
learn = ["prompt-hub/learn"]
fallback = ["prompt-hub/fallback"]
gather = ["prompt-hub/gather"]
voice = ["prompt-hub/voice"]
accessibility = ["prompt-hub/accessibility"]
budget = ["prompt-hub/budget"]
cost-limits = ["prompt-hub/cost-limits"]
quota = ["prompt-hub/quota"]
circuit-breaker = ["prompt-hub/circuit-breaker"]
moderation = ["prompt-hub/moderation"]
malware-scan = ["prompt-hub/malware-scan"]
sandbox = ["prompt-hub/sandbox"]
retention = ["prompt-hub/retention"]
auto-purge = ["prompt-hub/auto-purge"]
voice-anonymize = ["prompt-hub/voice-anonymize"]
multi-provider = ["prompt-hub/multi-provider"]
provider-health = ["prompt-hub/provider-health"]
load-balance = ["prompt-hub/load-balance"]
offline = ["prompt-hub/offline"]
local-llm = ["prompt-hub/local-llm"]
satisfaction = ["prompt-hub/satisfaction"]
analytics = ["prompt-hub/analytics"]
canary = ["prompt-hub/canary"]
gradual-rollout = ["prompt-hub/gradual-rollout"]
beta-program = ["prompt-hub/beta-program"]
mobile = ["prompt-hub/mobile"]
touch = ["prompt-hub/touch"]
chaos = ["prompt-hub/chaos"]
chaos-automation = ["prompt-hub/chaos-automation"]

[dependencies]
prompt-hub = { path = "../prompt-hub" }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
regex = { workspace = true }
validator = { workspace = true }
dirs = { workspace = true }
dashmap = { workspace = true }
ratatui = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
console = { workspace = true, optional = true }
comfy-table = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }
tempfile = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
