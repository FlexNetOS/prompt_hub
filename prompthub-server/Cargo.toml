[package]
name = "prompthub-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP API server for prompt-hub"

[[bin]]
name = "prompthub-server"
path = "src/main.rs"

[features]
default = ["prompt-hub/handlebars", "prompt-hub/vibe", "prompt-hub/budget"]
smart = ["prompt-hub/smart"]
gather = ["prompt-hub/gather"]
vibe = ["prompt-hub/vibe"]
budget = ["prompt-hub/budget"]
rollback = ["prompt-hub/rollback"]
multi-provider = ["prompt-hub/multi-provider"]
gradual-rollout = ["prompt-hub/gradual-rollout"]
fallback = ["prompt-hub/fallback"]
privacy = ["prompt-hub/privacy"]
confidence = ["prompt-hub/confidence"]
cost = ["prompt-hub/cost"]
learn = ["prompt-hub/learn"]
cost-limits = ["prompt-hub/cost-limits"]
beta-program = ["prompt-hub/beta-program"]
quota = ["prompt-hub/quota"]
moderation = ["prompt-hub/moderation"]
smart-ort = ["prompt-hub/smart-ort"]
otel = ["prompt-hub/otel"]
tls = ["prompt-hub/tls", "dep:tokio-rustls"]
handlebars = ["prompt-hub/handlebars"]
tera = ["prompt-hub/tera"]
tiktoken = ["prompt-hub/tiktoken"]
tokenizers = ["prompt-hub/tokenizers"]
plugins = ["prompt-hub/plugins"]

[dependencies]
prompt-hub = { path = "../prompt-hub" }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["timeout"] }
tower-governor = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
clap = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["timeout", "compression-full"] }
