[package]
name = "prompt-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Production-ready prompt management library for LLM agent swarms"
readme = "README.md"

[features]
default = ["handlebars", "vibe", "rollback", "cost", "learn"]
smart = ["dep:ndarray"]
# ONNX runtime inference for smart search (off by default).
smart-ort = ["dep:ort"]
otel = ["dep:prometheus"]
tls = ["dep:tokio-rustls"]
# Template engine — pick one at compile time.
handlebars = ["dep:handlebars"]
tera = ["dep:tera"]
# Token counting backends — pick one or both.
tiktoken = ["dep:tiktoken-rs"]
tokenizers = ["dep:tokenizers"]
# Dynamic plugin loading via libloading/inventory inventory.
plugins = ["dep:libloading", "dep:inventory"]

# ---------------------------------------------------------------------------
# Stub features converted to real gated features (Category B): real pub API,
# hub.rs wiring exists, but were feature="[]" no-ops before this cleanup.
# Each gate adds a #[cfg(feature = "...")] on the module decl + hub wiring.
# ---------------------------------------------------------------------------
vibe = []
privacy = []
rollback = []
cost = []
confidence = []
cost-limits = []
learn = []
fallback = []
multimodal = []
satisfaction = []

# ---------------------------------------------------------------------------
# Real modules with code (Category C): kept as gated features. No optional
# deps required — these are pure Rust with existing std/deps already present.
# ---------------------------------------------------------------------------
quota = []
retention = []

canary = []
circuit-breaker = []
moderation = []
budget = []
analytics = []
preview = []
i18n = []

# ---------------------------------------------------------------------------
# Dead features — removed from Cargo.toml entirely. These had no module files,
# no hub.rs wiring, and zero meaningful source references:
#   beta-program, chaos, chaos-automation, cost-limits, gradual-rollout,
#   malware-scan, multi-provider, offline, qdrant, sandbox, voice-anonymize,
#   local-llm, mobile, accessibility, touch, voice, gather, auto-purge
# ---------------------------------------------------------------------------

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
libsql = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
regex = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
tokio-rustls = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }
dirs = { workspace = true }
notify = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
handlebars = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
tiktoken-rs = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true }
ort = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "search_latency"
harness = false

[[bench]]
name = "embedding_generation"
harness = false

[[bench]]
name = "db_write_throughput"
harness = false

[build-dependencies]
