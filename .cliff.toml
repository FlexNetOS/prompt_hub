# git-cliff configuration — Conventional-Commit changelog generation.
# Consumed by the CI `changelog` job (`git-cliff --output CHANGELOG.md`) and
# by `just changelog`. Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file. The format is
based on [Keep a Changelog](https://keepachangelog.com) and commits are grouped
by [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
# Parse commits as Conventional Commits, but keep non-conventional ones so the
# changelog is never silently empty.
conventional_commits = true
filter_unconventional = false
split_commits = false
# Keep only the commit subject (drop the body) so each changelog entry is a
# single readable line. `(?s)` makes `.` match newlines.
commit_preprocessors = [
  { pattern = '(?s)\n.*', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build System" },
  { message = '^chore\(deps\)', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
