[build]
rustflags = ["-W", "clippy::all", "-D", "warnings"]

# Use the default system linker (cc/gcc + ld). The upstream config hard-coded
# clang + lld, which are not installed on this workstation; restore the
# clang/lld lines once those tools are present (faster linking).

[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true

# Vendored crate sources — all external dependencies are committed under vendor/
# so the workspace builds fully offline / self-contained (no crates.io fetch).
# Regenerate after any dependency change with: cargo vendor vendor
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
