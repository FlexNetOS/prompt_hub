[workspace]
members = ["prompt-hub", "prompthub", "prompthub-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
authors = ["PromptHub Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/prompthub/prompthub"
homepage = "https://prompthub.dev"
documentation = "https://docs.rs/prompt-hub"
keywords = ["llm", "prompt", "ai", "agents", "swarm"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.15" }
tokio-tungstenite = { version = "0.29.0" }
tower = { version = "0.5.2" }
tower-http = { version = "0.7.0", features = ["cors", "compression-full", "trace", "request-id"] }
tower-governor = { version = "0.7", package = "tower_governor" }
axum = { version = "0.8.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.140" }
serde_yaml = { version = "0.9.34" }
toml = { version = "1.1.2" }
# Local-only: storage uses `Builder::new_local`. Dropping libsql's default
# `replication`/`remote`/`sync`/`tls` features removes its bundled hyper-rustls
# → rustls 0.22 → rustls-webpki 0.102 chain (4 RUSTSEC advisories we don't use).
libsql = { version = "0.9", default-features = false, features = ["core"] }
thiserror = { version = "2.0.12" }
anyhow = { version = "1.0.98" }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
tracing-appender = { version = "0.2.3" }
uuid = { version = "1.18.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
semver = { version = "1.0.26", features = ["serde"] }
validator = { version = "0.19", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive", "cargo", "env"] }
clap_complete = { version = "4.5.50" }
handlebars = { version = "6.4.0" }
tera = { version = "2.0.0" }
tiktoken-rs = { version = "0.12" }
tokenizers = { version = "0.23" }
libloading = { version = "0.9.0" }
inventory = { version = "0.3.20" }
regex = { version = "1.11.2" }
fancy-regex = { version = "0.16.2" }
argon2 = { version = "0.5.3" }
# auth.rs uses `argon2::password_hash::rand_core::OsRng`, gated behind the
# password-hash `getrandom` feature, which argon2's own `rand` feature does NOT
# forward (it only enables `password-hash/rand_core`). argon2 0.5.3 re-exports
# `password-hash` v0.5.0, so we depend on that SAME version with `getrandom` here:
# Cargo feature-unification then turns on `getrandom` for the v0.5.0 crate argon2
# re-exports, so `OsRng` resolves in isolated default-feature builds too (not only
# under --all-features). NOTE: the version MUST match argon2's (0.5.x) — a 0.6.x
# dep is a different crate and never unifies (that was the latent default-build bug).
password-hash = { version = "0.5", features = ["getrandom"] }
rustls = { version = "0.23.26" }
tokio-rustls = { version = "0.26.2" }
ratatui = { version = "0.30" }
dialoguer = { version = "0.12" }
console = { version = "0.16" }
comfy-table = { version = "7.1" }
syntect = { version = "5.2" }
ndarray = { version = "0.17.2" }
petgraph = { version = "0.8.3" }
dirs = { version = "6.0.0" }
notify = { version = "8.2.0" }
dashmap = { version = "6.1" }
# Prometheus text exposition only. `default-features = false` drops the
# `protobuf` exposition format (and the unmaintained `protobuf` crate with it),
# keeping the dependency graph free of known-vulnerable transitive deps. The
# OpenTelemetry Prometheus exporter (`opentelemetry-prometheus`) is intentionally
# NOT used: it is discontinued (0.29 is its final release) and pulls that same
# vulnerable `protobuf` crate. See prompt-hub `otel` feature.
prometheus = { version = "0.14.0", default-features = false }
utoipa = { version = "5.0" }
schemars = { version = "1.2" }
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "multipart"] }
sha2 = { version = "0.11.0" }
tempfile = { version = "3.19.1" }

# Template engine (choose one)
# handlebars = { workspace = true }  # or tera

# Dev dependencies (workspace)
criterion = { version = "0.8.2", features = ["async_tokio"] }
assert_cmd = { version = "2.0.17" }
predicates = { version = "3.1.3" }
proptest = { version = "1.6.1" }
git-cliff = { version = "2.8.0" }
insta = { version = "1.42.2" }
ort = { version = "2.0.0-rc.12" }
hf-hub = { version = "1.0.0-rc.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
